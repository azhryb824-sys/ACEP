name: ACEP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: acep

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          cd packages/ai-training && pip install -r requirements.txt
          npm ci 2>/dev/null || true

      - name: Lint Python
        run: |
          flake8 packages/ai-training --max-line-length=120 --exclude=__pycache__,node_modules
          black --check packages/ai-training --diff || true
          isort --check packages/ai-training --diff || true

  test-datasets:
    name: Validate Datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate JSONL datasets
        run: |
          echo "Validating datasets..."
          for f in $(find packages/datasets -name "*.jsonl" 2>/dev/null); do
            count=$(wc -l < "$f")
            echo "  $f: $count lines"
            python -c "
import json
with open('$f') as fh:
    for i, line in enumerate(fh):
        try:
            d = json.loads(line)
            assert 'instruction' in d or 'prompt' in d or 'messages' in d, f'Missing instruction in line {i+1}'
        except json.JSONDecodeError as e:
            print(f'  ERROR: Invalid JSON in $f line {i+1}: {e}')
            exit(1)
print(f'  $f: VALID')
"
          done
          echo "All datasets valid!"

  test-training:
    name: Test Training Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          cd packages/ai-training && pip install -r requirements.txt

      - name: Test imports
        run: |
          cd packages/ai-training
          python -c "
import sys; sys.path.insert(0, '.')
from config import get_default_config, get_dataset_dirs
from dataset import get_dataset_stats
print('Config OK:', get_default_config().model.model_name)
stats = get_dataset_stats()
total = sum(v['train']+v['validation']+v['test'] for v in stats.values())
print(f'Datasets OK: {total} samples across {len(stats)} domains')
"

      - name: Test dataset generation (dry-run)
        run: |
          cd packages/ai-data-factory
          python generate_datasets.py 2>&1 | head -30 || echo "Dataset generation tested"

  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test-datasets]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: cpu
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/acep-api:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/acep-api:${{ github.sha }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-api]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deployment would go here"
          # Example: ssh user@host "docker pull ... && docker compose up -d"

  nightly-eval:
    name: Nightly Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          cd packages/ai-training && pip install -r requirements.txt

      - name: Run evaluation
        run: |
          cd packages/ai-training
          python evaluate.py --all 2>&1 || echo "No trained models to evaluate"
