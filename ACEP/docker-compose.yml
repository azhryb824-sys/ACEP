version: "3.8"

services:
  acep-api:
    build:
      context: .
      target: gpu
    container_name: acep-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/acep/models
      - ./packages/datasets:/acep/packages/datasets
      - ./packages/ai-training:/acep/packages/ai-training
      - cache:/models/cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/models/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - acep-net

  acep-api-cpu:
    build:
      context: .
      target: cpu
    container_name: acep-api-cpu
    ports:
      - "8001:8000"
    volumes:
      - ./models:/acep/models
      - ./packages/datasets:/acep/packages/datasets
      - ./packages/ai-training:/acep/packages/ai-training
      - cache:/models/cache
    environment:
      - TRANSFORMERS_CACHE=/models/cache
    restart: unless-stopped
    networks:
      - acep-net

  acep-ui:
    image: nginx:alpine
    container_name: acep-ui
    ports:
      - "80:80"
    volumes:
      - ./packages/ui/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - acep-api
    restart: unless-stopped
    networks:
      - acep-net

  acep-mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: acep-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped
    networks:
      - acep-net

volumes:
  cache:

networks:
  acep-net:
    driver: bridge
