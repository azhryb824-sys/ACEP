<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACEP AI Training Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --border: #334155;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-tertiary: #64748b;
  --blue: #3b82f6;
  --blue-dark: #1d4ed8;
  --emerald: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --violet: #8b5cf6;
  --cyan: #06b6d4;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Cairo', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: 260px; background: var(--bg-card); border-left: 1px solid var(--border); padding: 20px; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
.sidebar-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.sidebar-logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--blue), var(--violet)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
.sidebar-logo-text { font-size: 20px; font-weight: 700; }
.sidebar-logo-sub { font-size: 11px; color: var(--text-tertiary); }
.sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
.sidebar-section { margin-bottom: 20px; }
.sidebar-section-title { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-right: 12px; }
.sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; font-size: 14px; cursor: pointer; transition: all 0.15s; }
.sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-item.active { background: rgba(59,130,246,0.15); color: var(--blue); }

/* Main */
.main { margin-right: 260px; flex: 1; padding: 24px; max-width: 1400px; }

/* Header */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
.header h1 { font-size: 24px; font-weight: 700; }
.header p { color: var(--text-secondary); font-size: 14px; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-card .label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.stat-card .trend-up { color: var(--emerald); }
.stat-card .trend-down { color: var(--red); }

/* Cards */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
.card-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.card-title { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }
.card-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

/* Grid */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* Tables */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
th { color: var(--text-tertiary); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
td { color: var(--text-secondary); }
tr:hover td { background: rgba(51,65,85,0.3); }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
.badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
.badge-emerald { background: rgba(16,185,129,0.15); color: var(--emerald); }
.badge-amber { background: rgba(245,158,11,0.15); color: var(--amber); }
.badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
.badge-violet { background: rgba(139,92,246,0.15); color: var(--violet); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.btn-primary { background: var(--blue); color: white; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: var(--red); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-hover); }

/* Form */
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 12px; color: var(--text-tertiary); margin-bottom: 4px; }
.form-input, .form-select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; font-family: inherit; }
.form-select { cursor: pointer; }

/* Progress */
.progress { background: var(--bg-hover); border-radius: 100px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 100px; transition: width 0.5s; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { padding: 10px 16px; font-size: 13px; color: var(--text-tertiary); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* Status dots */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }
.dot-green { background: var(--emerald); }
.dot-amber { background: var(--amber); }
.dot-red { background: var(--red); }
.dot-blue { background: var(--blue); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 90%; max-width: 520px; max-height: 80vh; overflow-y: auto; }
.modal h2 { margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* Toast */
.toast-container { position: fixed; top: 20px; left: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; animation: slideIn 0.3s; }
.toast-info { background: var(--blue); color: white; }
.toast-success { background: var(--emerald); color: white; }
.toast-error { background: var(--red); color: white; }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Spinner */
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Empty state */
.empty { text-align: center; padding: 40px; color: var(--text-tertiary); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }

/* Metric change */
.metric-up { color: var(--emerald); }
.metric-down { color: var(--red); }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-right: 0; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

.server-status { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 12px; border-radius: 8px; }
.server-status.connected { background: rgba(16,185,129,0.1); color: var(--emerald); }
.server-status.disconnected { background: rgba(239,68,68,0.1); color: var(--red); }

.config-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.config-row:last-child { border-bottom: none; }
.config-key { color: var(--text-tertiary); }
.config-value { color: var(--text-primary); font-weight: 500; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">AC</div>
      <div>
        <div class="sidebar-logo-text">ACEP</div>
        <div class="sidebar-logo-sub">AI Training Dashboard</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-title">الرئيسية</div>
        <a class="sidebar-item active" onclick="showPage('overview')">📊 نظرة عامة</a>
        <a class="sidebar-item" onclick="showPage('models')">🤖 النماذج</a>
        <a class="sidebar-item" onclick="showPage('training')">🎯 التدريب</a>
        <a class="sidebar-item" onclick="showPage('datasets')">📚 البيانات</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">التحليل</div>
        <a class="sidebar-item" onclick="showPage('evaluation')">📈 التقييم</a>
        <a class="sidebar-item" onclick="showPage('experiments')">🔬 التجارب</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">النظام</div>
        <a class="sidebar-item" onclick="showPage('config')">⚙️ الإعدادات</a>
        <a class="sidebar-item" onclick="showPage('logs')">📋 السجلات</a>
      </div>
    </nav>
  </aside>

  <main class="main" id="main-content">
    <!-- Dynamic content loaded here -->
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────
const API = 'http://localhost:8000';
let state = { models: [], datasets: {}, metrics: {}, experiments: [] };

// ─── Toast ──────────────────────────────────────────────────────────────
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ─── Modal ──────────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function hideModal() { document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').onclick = e => { if (e.target === e.currentTarget) hideModal(); };

// ─── API ────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  if (!res.ok) { const err = await res.text(); throw new Error(err); }
  return res.json();
}

async function checkServer() {
  try {
    const info = await api('GET', '/health');
    return info;
  } catch { return null; }
}

// ─── Pages ──────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.sidebar-item[onclick*="${name}"]`)?.classList.add('active');
  const pages = { overview: renderOverview, models: renderModels, training: renderTraining,
    datasets: renderDatasets, evaluation: renderEvaluation, experiments: renderExperiments,
    config: renderConfig, logs: renderLogs };
  if (pages[name]) pages[name]();
}

// ─── Overview ───────────────────────────────────────────────────────────
async function renderOverview() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div style="text-align:center;padding:60px"><div class="spinner"></div><p style="margin-top:12px;color:var(--text-tertiary)">جاري تحميل البيانات...</p></div>';

  const health = await checkServer();
  let models = [], datasets = {};
  try { models = await api('GET', '/models'); } catch {}
  try { datasets = await api('GET', '/datasets'); } catch {}
  state.models = models; state.datasets = datasets;

  const totalSamples = datasets.datasets?.reduce((s, d) => {
    return s + Object.values(d.files || {}).reduce((a, b) => a + b, 0);
  }, 0) || 0;

  const gpu = health?.gpu_available;
  const gpuName = health?.gpu_name || 'N/A';
  const loaded = health?.models_loaded || 0;

  main.innerHTML = `
    <div class="header">
      <div><h1>نظرة عامة</h1><p>لوحة تحكم منصة ACEP للتدريب</p></div>
      <div class="server-status ${health ? 'connected' : 'disconnected'}">
        <span class="dot ${health ? 'dot-green' : 'dot-red'}"></span>
        ${health ? '✓ متصل بالخادم' : '✗ الخادم غير متصل'}
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">النماذج المتاحة</div>
        <div class="value">${models.length}</div>
        <div class="sub">${loaded} محملة في الذاكرة</div>
      </div>
      <div class="stat-card">
        <div class="label">مجموعات البيانات</div>
        <div class="value">${datasets.datasets?.length || 0}</div>
        <div class="sub">${totalSamples.toLocaleString()} بايت</div>
      </div>
      <div class="stat-card">
        <div class="label">المسرع</div>
        <div class="value">${gpu ? 'GPU' : 'CPU'}</div>
        <div class="sub">${gpuName}</div>
      </div>
      <div class="stat-card">
        <div class="label">الذاكرة المحملة</div>
        <div class="value">${loaded}</div>
        <div class="sub">نموذج</div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-header"><span class="card-title">النماذج المسجلة</span></div>
        <div class="card-body" style="padding:0">
          ${models.length ? `
          <table>
            <thead><tr><th>الاسم</th><th>الحجم</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              ${models.map(m => `
                <tr>
                  <td><strong>${m.name}</strong></td>
                  <td>${m.size_gb || '?'} GB</td>
                  <td><span class="badge ${m.loaded ? 'badge-emerald' : 'badge-blue'}">${m.loaded ? 'محمل' : 'متاح'}</span></td>
                  <td><button class="btn btn-sm btn-ghost" onclick="showModelInfo('${m.name}')">تفاصيل</button></td>
                </tr>`).join('')}
            </tbody>
          </table>` : `<div class="empty"><div class="empty-icon">🤖</div><p>لا توجد نماذج مدربة بعد</p><button class="btn btn-primary mt-4" onclick="showPage('training')">بدء تدريب</button></div>`}
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">مجموعات البيانات</span></div>
        <div class="card-body" style="padding:0">
          ${datasets.datasets?.length ? `
          <table>
            <thead><tr><th>المجال</th><th>الملفات</th><th></th></tr></thead>
            <tbody>
              ${datasets.datasets.map(d => `
                <tr>
                  <td><strong>${d.name}</strong></td>
                  <td>${Object.keys(d.files || {}).length}</td>
                  <td><button class="btn btn-sm btn-ghost" onclick="showPage('datasets')">عرض</button></td>
                </tr>`).join('')}
            </tbody>
          </table>` : `<div class="empty"><div class="empty-icon">📚</div><p>لم يتم إنشاء بيانات بعد</p></div>`}
        </div>
      </div>
    </div>
  `;
}

// ─── Models ─────────────────────────────────────────────────────────────
async function renderModels() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div style="text-align:center;padding:60px"><div class="spinner"></div></div>';

  let models = [];
  try { models = await api('GET', '/models'); } catch {}
  state.models = models;

  main.innerHTML = `
    <div class="header">
      <div><h1>إدارة النماذج</h1><p>${models.length} نموذج مسجل</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" onclick="refreshModels()">⟳ تحديث</button>
        <button class="btn btn-primary" onclick="showTrainingModal()">+ تدريب جديد</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="label">الإجمالي</div><div class="value">${models.length}</div></div>
      <div class="stat-card"><div class="label">محملة</div><div class="value">${models.filter(m=>m.loaded).length}</div></div>
      <div class="stat-card"><div class="label">LoRA</div><div class="value">${models.filter(m=>m.status==='lora').length}</div></div>
      <div class="stat-card"><div class="label">مدمجة</div><div class="value">${models.filter(m=>m.status==='merged').length}</div></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">جميع النماذج</span></div>
      <div class="card-body" style="padding:0">
        ${models.length ? `
        <table>
          <thead><tr><th>الاسم</th><th>الحالة</th><th>الحجم</th><th>محمل</th><th>إجراءات</th></tr></thead>
          <tbody>
            ${models.map(m => `
              <tr>
                <td><strong>${m.name}</strong></td>
                <td><span class="badge ${m.status==='merged'?'badge-emerald':m.status==='lora'?'badge-blue':'badge-amber'}">${m.status}</span></td>
                <td>${m.size_gb || '?'} GB</td>
                <td>${m.loaded ? '<span class="dot dot-green"></span>نعم' : '<span class="dot"></span>لا'}</td>
                <td style="display:flex;gap:4px">
                  ${!m.loaded ? `<button class="btn btn-sm btn-outline" onclick="loadModel('${m.name}')">تحميل</button>` :
                    `<button class="btn btn-sm btn-outline" onclick="unloadModel('${m.name}')">تفريغ</button>`}
                  <button class="btn btn-sm btn-ghost" onclick="showModelInfo('${m.name}')">تفاصيل</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty"><div class="empty-icon">🤖</div><p>لا توجد نماذج. قم بتدريب نموذج أولاً.</p></div>`}
      </div>
    </div>
  `;
}

async function loadModel(name) {
  try { await api('POST', `/models/${name}/load`); toast(`تم تحميل النموذج ${name}`, 'success'); renderModels(); }
  catch(e) { toast(`فشل التحميل: ${e.message}`, 'error'); }
}

async function unloadModel(name) {
  try { await api('POST', `/models/${name}/unload`); toast(`تم تفريغ النموذج ${name}`, 'info'); renderModels(); }
  catch(e) { toast(`فشل التفريغ: ${e.message}`, 'error'); }
}

async function showModelInfo(name) {
  try {
    const info = await api('GET', `/models/${name}`);
    showModal(`
      <h2>${info.name}</h2>
      <div style="margin-bottom:16px">
        <div class="config-row"><span class="config-key">المسار</span><span class="config-value">${info.path}</span></div>
        <div class="config-row"><span class="config-key">الحالة</span><span class="config-value">${info.status}</span></div>
        <div class="config-row"><span class="config-key">الحجم</span><span class="config-value">${info.size_gb} GB</span></div>
        <div class="config-row"><span class="config-key">محمل</span><span class="config-value">${info.loaded ? 'نعم' : 'لا'}</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="hideModal()">إغلاق</button>
        ${!info.loaded ? `<button class="btn btn-primary" onclick="loadModel('${info.name}');hideModal()">تحميل</button>` : ''}
      </div>
    `);
  } catch(e) { toast(e.message, 'error'); }
}

async function refreshModels() { await renderModels(); toast('تم تحديث القائمة', 'info'); }

// ─── Training ───────────────────────────────────────────────────────────
async function renderTraining() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="header">
      <div><h1>لوحة التدريب</h1><p>تدريب نماذج LoRA على بيانات المقاولات</p></div>
      <button class="btn btn-primary" onclick="showTrainingModal()">+ تدريب جديد</button>
    </div>

    <div class="card">
      <div class="card-body">
        <p style="color:var(--text-secondary);text-align:center;padding:20px">
          🎯 استخدم زر "تدريب جديد" لبدء تدريب نموذج مخصص<br>
          <span style="font-size:13px;color:var(--text-tertiary)">يمكنك تحديد المجالات، عدد الحقب، ومعدل التعلم</span>
        </p>
      </div>
    </div>
  `;
}

function showTrainingModal() {
  const domains = state.datasets.datasets || [];
  showModal(`
    <h2>تدريب نموذج جديد</h2>
    <div class="form-group">
      <label class="form-label">اسم النموذج (اختياري)</label>
      <input class="form-input" id="trainName" placeholder="acep-custom-model">
    </div>
    <div class="form-group">
      <label class="form-label">المجالات</label>
      <select class="form-select" id="trainDomains" multiple style="height:100px">
        ${domains.map(d => `<option value="${d.name}">${d.name}</option>`).join('')}
      </select>
      <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">Ctrl+click لاختيار متعدد. اترك فارغاً للكل.</div>
    </div>
    <div class="grid grid-2">
      <div class="form-group">
        <label class="form-label">عدد الحقب (Epochs)</label>
        <input class="form-input" id="trainEpochs" type="number" value="3" min="1" max="20">
      </div>
      <div class="form-group">
        <label class="form-label">معدل التعلم</label>
        <input class="form-input" id="trainLR" type="text" value="2e-4">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">رتبة LoRA</label>
      <input class="form-input" id="trainR" type="number" value="16" min="4" max="128">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="hideModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="startTraining()">بدء التدريب</button>
    </div>
  `);
}

async function startTraining() {
  const name = document.getElementById('trainName').value || null;
  const select = document.getElementById('trainDomains');
  const domains = Array.from(select.selectedOptions).map(o => o.value);
  const epochs = parseInt(document.getElementById('trainEpochs').value) || 3;
  const lr = parseFloat(document.getElementById('trainLR').value) || 2e-4;
  const r = parseInt(document.getElementById('trainR').value) || 16;

  hideModal();
  toast('جاري بدء التدريب...', 'info');

  try {
    const result = await api('POST', '/train', {
      domains: domains.length ? domains : null,
      epochs, learning_rate: lr, lora_r: r, output_name: name
    });
    toast(`تم بدء التدريب: ${result.job_id}`, 'success');
  } catch(e) {
    toast(`فشل بدء التدريب: ${e.message}`, 'error');
  }
}
