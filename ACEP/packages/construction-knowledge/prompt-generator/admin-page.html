<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Prompt Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { color: #38bdf8; margin-bottom: 8px; }
  .subtitle { color: #94a3b8; margin-bottom: 24px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
  .card h2 { color: #38bdf8; font-size: 18px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .stat { background: #0f172a; border-radius: 8px; padding: 16px; text-align: center; }
  .stat .value { font-size: 28px; font-weight: bold; color: #38bdf8; }
  .stat .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  select, input, button, textarea {
    padding: 8px 12px; border-radius: 6px; border: 1px solid #475569;
    background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #3b82f6; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #ef4444; }
  button.success { background: #16a34a; }
  button.success:hover { background: #22c55e; }
  button.secondary { background: #475569; }
  button.secondary:hover { background: #64748b; }
  textarea { width: 100%; min-height: 60px; font-family: monospace; }
  .prompt-item {
    background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px;
    border-left: 3px solid #38bdf8;
  }
  .prompt-item .meta { font-size: 11px; color: #64748b; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .prompt-item .meta span { background: #1e293b; padding: 2px 6px; border-radius: 4px; }
  .prompt-item .lang-toggle { cursor: pointer; color: #38bdf8; font-size: 12px; }
  .prompt-item .ar-text { display: none; }
  .prompt-item.show-ar .ar-text { display: block; }
  .prompt-item.show-ar .en-text { display: none; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .badge.en { background: #1d4ed8; }
  .badge.ar { background: #b45309; }
  .badge.both { background: #6d28d9; }
  .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 8px 16px; border-radius: 8px; background: #1e293b; cursor: pointer; border: 1px solid transparent; }
  .tab.active { border-color: #38bdf8; color: #38bdf8; }
  .tab:hover { border-color: #475569; }
  .page { display: none; }
  .page.active { display: block; }
  .log { max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #0f172a; padding: 8px; border-radius: 6px; }
  .log div { padding: 2px 0; border-bottom: 1px solid #1e293b; }
</style>
</head>
<body>
<div class="container">
  <h1>🧠 Engineering Prompt Generator</h1>
  <div class="subtitle">توليد برومبتات معمارية ذكية لتدريب نماذج الرؤية الاصطناعية</div>

  <div class="tab-bar">
    <div class="tab active" onclick="showTab('generate')">توليد</div>
    <div class="tab" onclick="showTab('database')">قاعدة البيانات</div>
    <div class="tab" onclick="showTab('batch')">توليد تلقائي</div>
    <div class="tab" onclick="showTab('export')">تصدير</div>
  </div>

  <!-- Generate -->
  <div id="page-generate" class="page active">
    <div class="card">
      <h2>توليد برومبتات</h2>
      <div class="row" style="margin-bottom:12px">
        <select id="gen-lang"><option value="en">English</option><option value="ar">العربية</option><option value="both">Both</option></select>
        <input type="number" id="gen-count" value="10" min="1" max="1000" style="width:80px">
        <select id="gen-type"><option value="">All Types</option></select>
        <select id="gen-phase"><option value="">All Phases</option></select>
        <button onclick="generate()">توليد</button>
        <button class="danger" onclick="resetGenerator()">إعادة تعيين</button>
      </div>
      <div id="gen-output"></div>
    </div>
  </div>

  <!-- Database -->
  <div id="page-database" class="page">
    <div class="card">
      <h2>قاعدة بيانات البرومبتات</h2>
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="db-search" placeholder="بحث..." style="flex:1">
        <button onclick="searchDB()">بحث</button>
        <button onclick="loadDBStats()">تحديث</button>
      </div>
      <div id="db-stats" class="grid" style="margin-bottom:16px"></div>
      <div id="db-results"></div>
    </div>
  </div>

  <!-- Batch -->
  <div id="page-batch" class="page">
    <div class="card">
      <h2>التوليد التلقائي في الخلفية</h2>
      <div class="row" style="margin-bottom:12px">
        <input type="number" id="batch-size" value="1000" min="100" max="50000" style="width:100px" title="Batch size">
        <input type="number" id="batch-interval" value="300000" min="5000" style="width:120px" title="Interval (ms)">
        <select id="batch-lang"><option value="en">English</option><option value="ar">العربية</option><option value="both">Both</option></select>
        <label><input type="checkbox" id="batch-autosave"> Auto export</label>
        <button class="success" onclick="startBatch()">▶ بدء</button>
        <button class="danger" onclick="stopBatch()">■ إيقاف</button>
        <button onclick="batchStatus()">تحديث</button>
      </div>
      <div id="batch-status"></div>
      <div id="batch-log" class="log"></div>
    </div>
  </div>

  <!-- Export -->
  <div id="page-export" class="page">
    <div class="card">
      <h2>تصدير بيانات التدريب</h2>
      <div class="row">
        <button onclick="exportJSONL()">📥 تصدير JSONL</button>
        <button onclick="exportJSON()">📥 تصدير JSON</button>
      </div>
      <div id="export-result" style="margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1/engineering-prompts';
let langToggle = {};

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${{generate:1,database:2,batch:3,export:4}[name]})`).classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}

// Load type/phase selects
(async function init() {
  const vars = await api('/variables');
  const typeSel = document.getElementById('gen-type');
  Object.entries(vars.projectTypeDetails || {}).forEach(([k, v]) => {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = v.name.en;
    typeSel.appendChild(opt);
  });
  const phaseSel = document.getElementById('gen-phase');
  (vars.phases || []).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name.en;
    phaseSel.appendChild(opt);
  });
  loadDBStats();
})();

async function generate() {
  const count = +document.getElementById('gen-count').value;
  const lang = document.getElementById('gen-lang').value;
  const projectType = document.getElementById('gen-type').value || undefined;
  const phaseId = document.getElementById('gen-phase').value || undefined;
  const out = document.getElementById('gen-output');

  const data = await api('/generate', {
    method: 'POST',
    body: JSON.stringify({ count, language: lang, projectType, phaseId }),
  });

  out.innerHTML = '';
  const combo = await api('/combinations');
  out.innerHTML = `<div style="margin-bottom:8px;color:#94a3b8">المجموع الكلي: ${combo.totalPossibleCombinations.toLocaleString()} تركيبة | تم التوليد: ${data.generated} | في قاعدة البيانات: ${data.totalInDB}</div>`;

  (data.prompts || []).forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'prompt-item';
    div.id = 'prompt-' + i;
    div.innerHTML = `
      <div class="${lang === 'ar' ? '' : 'en-text'}">${p.prompt}</div>
      ${p.promptAr ? `<div class="ar-text">${p.promptAr}</div>` : ''}
      ${p.promptAr ? '<span class="lang-toggle" onclick="toggleLang('+i+')">🌐 العربية/English</span>' : ''}
      <div class="meta">
        <span class="badge ${lang}">${lang}</span>
        <span>${p.architecturalStyle}</span>
        <span>${p.projectType}</span>
        <span>${p.phase}</span>
        <span>${p.finishing}</span>
        <span>${p.lighting}</span>
      </div>
    `;
    out.appendChild(div);
  });
}

function toggleLang(i) {
  const el = document.getElementById('prompt-'+i);
  el.classList.toggle('show-ar');
}

async function loadDBStats() {
  const stats = await api('/db/stats');
  const el = document.getElementById('db-stats');
  el.innerHTML = '';
  el.innerHTML = `
    <div class="stat"><div class="value">${stats.total}</div><div class="label">Total Prompts</div></div>
    <div class="stat"><div class="value">${Object.keys(stats.byProjectType || {}).length}</div><div class="label">Project Types</div></div>
    <div class="stat"><div class="value">${Object.keys(stats.byPhase || {}).length}</div><div class="label">Phases</div></div>
    <div class="stat"><div class="value">${Object.keys(stats.byStyle || {}).length}</div><div class="label">Styles</div></div>
  `;
}

async function searchDB() {
  const q = document.getElementById('db-search').value;
  const data = await api('/db/search?q='+encodeURIComponent(q));
  const el = document.getElementById('db-results');
  if (!data.results || data.results.length === 0) { el.innerHTML = '<div style="color:#94a3b8">لا توجد نتائج</div>'; return; }
  el.innerHTML = `<div style="margin-bottom:8px;color:#94a3b8">${data.total} نتيجة</div>`;
  data.results.slice(0, 20).forEach(p => {
    const div = document.createElement('div');
    div.className = 'prompt-item';
    div.innerHTML = `<div>${p.prompt}</div><div class="meta"><span>${p.architecturalStyle || p.architecturalStyle}</span><span>${p.projectType}</span><span>${p.phase}</span></div>`;
    el.appendChild(div);
  });
}

async function resetGenerator() {
  await api('/reset');
  document.getElementById('gen-output').innerHTML = '<div style="color:#16a34a">✅ تم إعادة تعيين المولد</div>';
}

async function startBatch() {
  const body = {
    batchSize: +document.getElementById('batch-size').value,
    intervalMs: +document.getElementById('batch-interval').value,
    language: document.getElementById('batch-lang').value,
    autoExport: document.getElementById('batch-autosave').checked,
  };
  const data = await api('/batch/start', { method: 'POST', body: JSON.stringify(body) });
  addBatchLog('Started: ' + JSON.stringify(data.config));
  batchStatus();
}

async function stopBatch() {
  const data = await api('/batch/stop', { method: 'POST' });
  addBatchLog('Stopped: ' + JSON.stringify(data.stats));
}

async function batchStatus() {
  const data = await api('/batch/status');
  const el = document.getElementById('batch-status');
  el.innerHTML = `
    <div class="grid">
      <div class="stat"><div class="value">${data.running ? '▶' : '■'}</div><div class="label">Running</div></div>
      <div class="stat"><div class="value">${data.stats.totalGenerated}</div><div class="label">Generated</div></div>
      <div class="stat"><div class="value">${data.stats.totalBatches}</div><div class="label">Batches</div></div>
      <div class="stat"><div class="value">${data.stats.language}</div><div class="label">Language</div></div>
    </div>
  `;
}

function addBatchLog(msg) {
  const el = document.getElementById('batch-log');
  const div = document.createElement('div');
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

async function exportJSONL() {
  const data = await api('/export', { method: 'POST', body: JSON.stringify({ format: 'jsonl' }) });
  document.getElementById('export-result').innerHTML = `<div style="color:#16a34a">✅ تم التصدير: ${data.path}<br>إجمالي: ${data.total} برومبت</div>`;
}

async function exportJSON() {
  const data = await api('/export', { method: 'POST', body: JSON.stringify({ format: 'json' }) });
  document.getElementById('export-result').innerHTML = `<div style="color:#16a34a">✅ تم التصدير: ${data.path}<br>إجمالي: ${data.total} برومبت</div>`;
}
</script>
</body>
</html>
