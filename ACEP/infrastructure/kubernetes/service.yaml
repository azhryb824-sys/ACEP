apiVersion: v1
kind: Service
metadata:
  name: acep-{{SERVICE_NAME}}
  namespace: acep
  labels:
    app: acep
    service: {{SERVICE_NAME}}
spec:
  type: {{SERVICE_TYPE}}
  selector:
    app: acep
    service: {{SERVICE_NAME}}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acep-service
  namespace: acep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acep-service-role
  namespace: acep
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acep-service-role-binding
  namespace: acep
subjects:
  - kind: ServiceAccount
    name: acep-service
    namespace: acep
roleRef:
  kind: Role
  name: acep-service-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acep-ingress
  namespace: acep
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.acep-platform.com
      secretName: acep-tls
  rules:
    - host: api.acep-platform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acep-api-gateway
                port:
                  number: 8080
