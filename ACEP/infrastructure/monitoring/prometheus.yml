global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'acep-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'identity-service:8081'
          - 'project-engine:8082'
          - 'cost-engine:8083'
          - 'knowledge-service:8084'
          - 'llm-service:8085'
        labels:
          application: 'acep'

  - job_name: 'acep-databases'
    static_configs:
      - targets:
          - 'mongodb-exporter:9216'
          - 'postgres-exporter:9187'
        labels:
          application: 'acep-database'

  - job_name: 'acep-infrastructure'
    static_configs:
      - targets:
          - 'message-bus:6379'
        labels:
          application: 'acep-infrastructure'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          application: 'infrastructure'

  - job_name: 'acep-cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
        labels:
          application: 'infrastructure'
